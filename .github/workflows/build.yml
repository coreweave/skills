# CI: rebuild the skills library on every PR and fail if the committed
# dist/ tree is stale.
#
# Rationale (the "Supabase pattern"):
#   The repo commits dist/ — the fully-rendered SKILL.md files — so
#   downstream consumers (the Claude Skill loader, the plugin
#   marketplace) never need to run Python. The trade-off is that dist/
#   can drift from its sources if a contributor edits skills/ or
#   _snippets/ but forgets to rebuild. This workflow makes that
#   impossible to merge: a fresh build runs in CI, and any diff in
#   dist/ fails the PR.
#
# What this workflow does NOT do (yet):
#   - Run the bundle-level trigger eval (see evals/README.md). That
#     belongs in a separate job once an eval harness exists.
#   - Publish anything to a marketplace. Publishing is a separate
#     workflow gated on tagged releases.
#
# A maintainer can split this into multiple jobs (lint, build, eval) as
# the pipeline matures — single-job is fine for the scaffold.

name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-verify-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        # The full history is NOT required — `git diff` against
        # the working tree is purely local. Shallow checkout is fine.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the lower bound in pyproject.toml. Bump in lockstep.
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        # `pip install -e .` reads pyproject.toml so we don't duplicate
        # the dep list in two places. The `dev` extras are not needed
        # for the build itself.
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the build
        # build.py is a no-op skeleton today; once implemented it will
        # write to dist/ and into each plugins/<plugin>/skills/ tree.
        run: python build.py

      - name: Fail if dist/ is stale
        # The core invariant: after a fresh build, the working tree
        # under dist/ and plugins/ must be byte-identical to what's
        # committed. If this step fails, the contributor needs to run
        # `python build.py` locally and commit the resulting changes.
        #
        # We check BOTH:
        #   - `git diff --exit-code` for changes to tracked files, and
        #   - `git status --porcelain` (filtered to dist/ + plugins/)
        #     for any untracked files the build just produced.
        #
        # Without the second check, a contributor who adds a brand-new
        # skill but forgets to `git add` the resulting dist/<name>/
        # directory would slip past CI — the new files would exist on
        # disk but be invisible to `git diff` because they're untracked.
        #
        # We check dist/ AND the plugins/ trees the build also writes
        # into, so a contributor can't sneak past by only committing
        # one half.
        run: |
          fail=0
          if ! git diff --exit-code dist/ plugins/; then
            echo "::error::Tracked files in dist/ or plugins/ are out of date with sources."
            fail=1
          fi
          untracked=$(git ls-files --others --exclude-standard -- dist/ plugins/)
          if [ -n "$untracked" ]; then
            echo "::error::Build produced untracked files in dist/ or plugins/:"
            printf '::error::  %s\n' $untracked
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Run 'python build.py' locally and commit the result."
            exit 1
          fi

      - name: Fail if the evals and the installer would disagree
        # The step above proves dist/ and plugins/ match SOURCES. This one proves
        # the two consumers of that output agree: skills-evals mounts
        # dist/<skill>/, while a customer installs
        # plugins/<plugin>/skills/<skill>/ resolved through marketplace.json.
        #
        # build.py requires a `plugin:` field per skill but never validates it
        # against the marketplace catalog. A transposed plugin name writes a
        # directory no marketplace entry points at and leaves the previous copy
        # behind in the real plugin — so every later build updates the orphan
        # while the installable copy stays frozen. Both trees still agree with
        # sources, so the check above stays green.
        #
        # This inspects PACKAGING ONLY, never skill content: editing prose,
        # adding a skill, or changing a shared snippet cannot fail it.
        run: python scripts/check_plugin_parity.py
