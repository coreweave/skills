# CI: rebuild the skills library on every PR and fail if the committed
# dist/ tree is stale.
#
# Rationale (the "Supabase pattern"):
#   The repo commits dist/ — the fully-rendered SKILL.md files — so
#   downstream consumers (the Claude Skill loader, the plugin
#   marketplace) never need to run Python. The trade-off is that dist/
#   can drift from its sources if a contributor edits skills/ or
#   _snippets/ but forgets to rebuild. This workflow makes that
#   impossible to merge: a fresh build runs in CI, and any diff in
#   dist/ fails the PR.
#
# What this workflow does NOT do (yet):
#   - Run the bundle-level trigger eval (see evals/README.md). That
#     belongs in a separate job once an eval harness exists.
#   - Publish anything to a marketplace. Publishing is a separate
#     workflow gated on tagged releases.
#
# It DOES gate skill content for safety: the content-lint job rejects
# load-time `!command` directives and unpinned remote-code fetches
# — see scripts/lint_skill_content.py for the rules.
#
# A maintainer can split this further (eval, publish) as the pipeline
# matures.

name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  content-lint:
    # Content safety: skill bodies are executed, not
    # just read. A `!command` line runs at skill LOAD time — before the model
    # reads the body and before any tool-permission prompt — and an unpinned
    # `git clone` / `helm install` / curl-pipe-shell executes whatever the
    # remote serves today rather than the code that was reviewed. The lint
    # scans every .md under skills/, _snippets/, dist/, and plugins/; the
    # rules and the per-line escape hatch are documented in the script's
    # module docstring. Stdlib-only, so no pip install step.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the lower bound in pyproject.toml. Bump in lockstep.
          python-version: "3.11"

      - name: Lint skill content for load-time execution and unpinned remote code
        run: python scripts/lint_skill_content.py

  build-and-verify-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # The full history is NOT required — `git diff` against
        # the working tree is purely local. Shallow checkout is fine.

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the lower bound in pyproject.toml. Bump in lockstep.
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        # `pip install -e .` reads pyproject.toml so we don't duplicate
        # the dep list in two places. The `dev` extras are not needed
        # for the build itself.
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the build
        # build.py is a no-op skeleton today; once implemented it will
        # write to dist/ and into each plugins/<plugin>/skills/ tree.
        run: python build.py

      - name: Fail if dist/ is stale
        # The core invariant: after a fresh build, the working tree
        # under dist/ and plugins/ must be byte-identical to what's
        # committed. If this step fails, the contributor needs to run
        # `python build.py` locally and commit the resulting changes.
        #
        # We check BOTH:
        #   - `git diff --exit-code` for changes to tracked files, and
        #   - `git status --porcelain` (filtered to dist/ + plugins/)
        #     for any untracked files the build just produced.
        #
        # Without the second check, a contributor who adds a brand-new
        # skill but forgets to `git add` the resulting dist/<name>/
        # directory would slip past CI — the new files would exist on
        # disk but be invisible to `git diff` because they're untracked.
        #
        # We check dist/ AND the plugins/ trees the build also writes
        # into, so a contributor can't sneak past by only committing
        # one half.
        run: |
          fail=0
          if ! git diff --exit-code dist/ plugins/; then
            echo "::error::Tracked files in dist/ or plugins/ are out of date with sources."
            fail=1
          fi
          untracked=$(git ls-files --others --exclude-standard -- dist/ plugins/)
          if [ -n "$untracked" ]; then
            echo "::error::Build produced untracked files in dist/ or plugins/:"
            printf '::error::  %s\n' $untracked
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Run 'python build.py' locally and commit the result."
            exit 1
          fi

      - name: Fail if the evals and the installer would disagree
        # The step above proves dist/ and plugins/ match SOURCES. This one proves
        # the two consumers of that output agree: skills-evals mounts
        # dist/<skill>/, while a customer installs
        # plugins/<plugin>/skills/<skill>/ resolved through marketplace.json.
        #
        # build.py requires a `plugin:` field per skill but never validates it
        # against the marketplace catalog. A transposed plugin name writes a
        # directory no marketplace entry points at and leaves the previous copy
        # behind in the real plugin — so every later build updates the orphan
        # while the installable copy stays frozen. Both trees still agree with
        # sources, so the check above stays green.
        #
        # This inspects PACKAGING ONLY, never skill content: editing prose,
        # adding a skill, or changing a shared snippet cannot fail it.
        run: python scripts/check_plugin_parity.py

      - name: Fail if a dependency pin is inconsistent or unproposable
        # Pinning remote code only holds if every copy of
        # a pin agrees and the automation that proposes bumps keeps working.
        #
        # The first half is the same drift risk as dist/ staleness, one level
        # down: the ref-arch SHA, the Helm --version flags, and the s5cmd
        # release are rendered into dist/ and plugins/, so a hand-edited
        # rendered file would ship a customer a pin nobody reviewed.
        #
        # The second half is the one that fails silently. Renovate finds these
        # pins with custom regex managers in .github/renovate.json5. Rename the
        # snippet or re-wrap a --version line and the regex stops matching —
        # no error, no PR, just a pin that never gets proposed again. This
        # re-runs each manager against its own files and fails if one matches
        # nothing. Stdlib-only.
        run: python scripts/check_pinned_deps.py

      - name: Advisory — plugins with unreleased skill changes
        # DELIBERATELY NON-BLOCKING, AND DELIBERATELY NOT RUN ON PRs.
        #
        # `claude plugin update` compares version strings only. While every
        # plugin sat at 0.0.0, that command was a permanent no-op: a customer
        # could install, run update, be told they were current, and still be
        # served skills from a months-old commit. See
        # scripts/bump_plugin_version.py for the observed failure and the fix.
        #
        # The obvious next step would be a gate that fails a PR whose skills
        # changed without a version bump. We are NOT doing that. A version only
        # matters at the moment content is published, so a per-PR gate would tax
        # every skill edit during iteration and buy nothing in return. This step
        # therefore annotates on main and never fails, and cutting a release is
        # when someone runs the bump for real.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          # The job checks out shallow with no tags (see the checkout step), so
          # fetch just the tag refs rather than deepening the whole clone.
          git fetch --depth=1 origin 'refs/tags/*:refs/tags/*' 2>/dev/null || true
          ref=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$ref" ]; then
            echo "::notice::No release tag yet, so there is no baseline to diff against. This advisory starts working once the first 'claude plugin tag' release lands."
            exit 0
          fi
          python scripts/bump_plugin_version.py --check --since "$ref"
