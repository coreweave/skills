# CI: gate the bundle-level trigger evals (APPSEC-3967).
#
# Runs evals/run_router_evals.py — a router simulation that asks the model,
# once per eval query, which shipped skill should handle it (candidates are
# the name + description of every plugin-shipped dist/*/SKILL.md; which dist
# skills ship is owned by standalone-skills.yaml, read through
# scripts/check_plugin_parity.py). Fails when top-1 routing accuracy drops
# below the script's --min-accuracy default (deliberately NOT overridden
# here, so CI and local runs can never disagree about the threshold) or when
# a `required` eval entry fails. This is the eval job that build.yml's
# header reserves as separate work.
#
# The session-level harness (evals/run_trigger_evals.py, headless `claude -p`)
# is NOT run here — it needs a Claude Code login and installed plugins, so it
# stays a local/manual tool. See evals/README.md for the two layers.
#
# Secret: ANTHROPIC_API_KEY. Until a maintainer runs
#   gh secret set ANTHROPIC_API_KEY --repo coreweave/skills
# same-repo runs fail loudly: the runner exits 2 with exactly that
# instruction (a missing secret must never look like a passing eval).
# Fork PRs never receive repo secrets, so the job-level `if` skips them;
# the push-to-main run gates the merged result instead.
#
# Cost: one Claude API call per eval entry per vote (~cents per PR run at
# today's corpus size, with the skill listing prompt-cached). The nightly
# run uses --votes 3 to smooth out routing stochasticity and catch
# borderline entries drifting.
#
# All action refs are SHA-pinned; Renovate maintains the pins.

name: trigger-evals

on:
  pull_request:
    paths:
      - "dist/**"
      - "plugins/**"
      - "skills/**"
      - "_snippets/**"
      - "standalone-skills.yaml"
      - "evals/**"
      - "pyproject.toml"
      - ".github/workflows/trigger-evals.yml"
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "plugins/**"
      - "skills/**"
      - "_snippets/**"
      - "standalone-skills.yaml"
      - "evals/**"
      - "pyproject.toml"
      - ".github/workflows/trigger-evals.yml"
  schedule:
    # Nightly, off-peak UTC. Schedule ignores the paths filters above.
    - cron: "23 7 * * *"

concurrency:
  # A force-push to a PR branch cancels that branch's stale run; push-to-main
  # and nightly runs are never cancelled (a second merge must not cancel the
  # first merge's gate).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trigger-evals:
    # Fork PRs never receive repo secrets, so the gate cannot run there —
    # skip instead of failing every outside contribution; the push-to-main
    # run gates the merged result. (The github context is available at job
    # level; secrets are not.) Note: if Dependabot is ever enabled, its PRs
    # pass this check but receive DEPENDABOT secrets, not repo secrets — the
    # gate would then hard-fail Dependabot PRs until the secret is mirrored
    # with `gh secret set ... --app dependabot`.
    if: github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The nightly --votes 3 sweep needs headroom under API degradation.
    timeout-minutes: ${{ github.event_name == 'schedule' && 30 || 15 }}

    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the lower bound in pyproject.toml. Bump in lockstep.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install eval dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[evals]"

      - name: Run the trigger-eval gate
        # The secret is scoped to this step only — earlier steps (and the
        # third-party actions above) never see it. If it is unset, the
        # runner exits 2 before any API call with the `gh secret set`
        # instruction in an ::error annotation.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Nightly runs vote 3x per query (majority wins) to smooth out
          # routing stochasticity; PR/push runs keep the fast single call.
          VOTES: ${{ github.event_name == 'schedule' && '3' || '1' }}
        run: |
          python evals/run_router_evals.py \
            --evals evals/trigger-evals.jsonl \
            --dist dist \
            --votes "$VOTES" \
            --output trigger-eval-results.json

      - name: Upload results JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trigger-eval-results
          path: trigger-eval-results.json
          if-no-files-found: ignore
