# Post the mechanical half of a pin review onto the PR that moves a pin.
#
# WHY THIS IS ADVISORY AND NOT A GATE
#   CONTRIBUTING.md ("Reviewing a Renovate pin PR") asks the reviewer to open
#   the upstream diff and answer specific questions. This job fetches what they
#   would have fetched and greps it, so the tedious part is already done when
#   they arrive. It never fails: a grep over an upstream diff produces false
#   positives by construction, and a check that cries wolf is a check people
#   learn to skip. The decidable things — stale dist/, disagreeing pins — are
#   already hard failures in the build workflow.
#
# WHY `pull_request` AND NOT `pull_request_target`
#   pull_request_target would run with a write token against the PR's own code,
#   which is a well-known privilege-escalation footgun. This uses plain
#   pull_request: Renovate creates its branches inside this repo, so the comment
#   step has the token it needs. PRs from forks get no comment, which is the
#   correct trade — the summary is a convenience, not a control.

name: pin-review

on:
  pull_request:
    paths:
      - _snippets/coreweave-cks.md
      - skills/cw-self-managed-inference/body.md
      - skills/cw-load-model-to-bucket/references/s3-client-setup.md

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pin-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Need the base commit too, to see what the pin moved FROM.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the lower bound in pyproject.toml. Bump in lockstep.
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        # The summarizer reads the chart index with PyYAML, which comes from
        # pyproject.toml along with the rest of the build deps.
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Summarize the pin change
        id: summarize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/summarize_pin_change.py \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD > /tmp/pin-review.md
          if [ "$(head -c 13 /tmp/pin-review.md)" = "NO_PIN_CHANGE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on the PR
        # Sticky: edit the existing comment rather than adding one per push, so
        # a PR that gets rebased a few times does not accumulate stale reviews.
        if: steps.summarize.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- pin-review -->"
          printf '%s\n' "$marker" | cat - /tmp/pin-review.md > /tmp/body.md
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@/tmp/body.md >/dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" \
              -F body=@/tmp/body.md >/dev/null
            echo "posted new comment"
          fi
