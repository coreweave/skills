# APPSEC-3971: block PII / secrets / customer identifiers from entering
# the eval corpus.
#
# evals/README.md mandates sanitization ("anything you put here is
# effectively public"). This workflow makes the mandate deterministic and
# blocking with two independent jobs:
#
#   1. hygiene-scan — evals/check_eval_hygiene.py, the repo-specific
#      scanner (emails, ticket IDs, tenant URLs, hashed customer-name
#      denylist, ...). Its defaults cover evals/ AND every
#      skills/<name>/evals/ per-skill corpus. Stdlib-only; needs no
#      secrets. Findings surface as inline ::error annotations on the PR
#      diff. See evals/HYGIENE.md. The job self-tests the scanner first
#      (scripts/check_eval_hygiene_selftest.py) — a gate whose rules have
#      quietly stopped matching reports a leaking corpus clean, and that
#      failure is invisible without a planted-violation battery.
#   2. gitleaks — the upstream secret scanner as an independent second
#      opinion, scoped to evals/ with `detect --no-git`. Run via the
#      digest-pinned OCI image rather than gitleaks-action because the
#      action requires a GITLEAKS_LICENSE secret for org-owned repos;
#      the image needs no secrets at all.
#
# Both jobs are blocking by design: mark them required in branch
# protection after this merges. pull_request deliberately has NO paths:
# filter — a required check that is path-filtered never reports on PRs
# that don't touch those paths, leaving their merge button grey forever.
# Both jobs finish in seconds, so running them on every PR is cheaper
# than the footgun. The push-to-main run (a non-required backstop) IS
# path-filtered, since most merges don't touch evals/.
#
# Pinning: BOTH pins here are Renovate-maintained, and neither is a
# manual duty.
#   - the actions/checkout SHA, by the built-in github-actions manager
#     (it parses `uses:` lines).
#   - the gitleaks image tag+digest, by a custom regex manager in
#     .github/renovate.json5. It needs one because the pin lives inside
#     a `run:` string, which no built-in manager parses, and because the
#     blanket "disable container image updates" packageRule would
#     otherwise suppress it — a second rule re-enables this one image by
#     name. scripts/check_pinned_deps.py re-runs that manager's regex
#     against this file and fails CI if it ever matches zero times, so
#     reformatting the `docker run` line cannot silently strand the pin.
# Keep the tag and the digest on one line and in that order; that shape
# is what the manager's regex matches.

name: eval-hygiene

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "skills/**/evals/**"
      - "scripts/check_eval_hygiene_selftest.py"
      - ".github/workflows/eval-hygiene.yml"
      # The self-test asserts that every directory the scanner exempts is
      # gitignored, so an edit here can break the gate on its own.
      - ".gitignore"

permissions:
  contents: read

jobs:
  hygiene-scan:
    name: Eval PII/secret hygiene scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the lower bound in pyproject.toml, exactly as build.yml
          # does. Both scripts are stdlib-only, so this buys no packages
          # — it pins the INTERPRETER, so a blocking gate's behavior
          # can't shift under it when GitHub rolls the runner image.
          python-version: "3.11"

      - name: Self-test the scanner before trusting it
        # Ordered first on purpose. Every case in this battery is a hole
        # that was once real: it builds a throwaway corpus in a temp
        # directory (never committed — a committed fixture full of
        # planted violations would fail the gate it tests), plants one
        # violation per closed hole, and asserts the exact annotation
        # count per file, including zero for the known-benign
        # standards/zone/instance vocabulary the corpus legitimately
        # uses. If this step fails, the scan step below cannot be
        # believed.
        run: python3 scripts/check_eval_hygiene_selftest.py

      - name: Run hygiene scanner over evals/
        # Stdlib-only, so there is no pip install step — but the
        # interpreter is pinned above rather than taken from the runner.
        run: python3 evals/check_eval_hygiene.py

  gitleaks:
    name: gitleaks (eval corpora only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run gitleaks over evals/ and skills/*/evals/
        # --no-git: scan the checked-out files, not history — history is
        # the whole repo's concern, this gate owns the eval corpora.
        # --redact: never echo a matched secret into public CI logs.
        run: |
          set -euo pipefail
          scan() {
            echo "gitleaks: scanning $1"
            docker run --rm -v "$GITHUB_WORKSPACE/$1:/scan:ro" \
              ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
              detect --no-git --source /scan --redact --verbose --exit-code 1
          }
          scan evals
          for dir in skills/*/evals; do
            if [ -d "$dir" ]; then scan "$dir"; fi
          done
