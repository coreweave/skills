frontmatter:
  name: cw-create-cluster
  description: >-
    Programmatically creates a CKS (CoreWeave Kubernetes Service) cluster and VPC
    using the CoreWeave Terraform reference architecture. Covers quota checking,
    VPC creation, cluster provisioning, waiting for readiness, and the cluster's
    first node pool. Use this skill whenever a customer mentions creating a cluster,
    setting up CKS, provisioning Kubernetes infrastructure, deploying a new
    environment, or wants help with CoreWeave Terraform. Use when asked to create a
    cluster, create a CKS cluster, create a coreweave Kubernetes cluster. Also use it
    when someone asks about VPCs, Kubernetes versions, or cluster networking on
    CoreWeave. If the customer ALREADY has a running cluster and only wants to add
    compute, use cw-create-node-pool instead.
  allowed-tools:
    - Bash
    - Read
    - Write
  disallowed-tools:
    # Removed from the model's pool while this skill is active (the Skill
    # loader enforces this key; `allowed-tools` above does not restrict).
    # Conservative starting set — none of these appear in any skill body:
    #   WebFetch/WebSearch: block pulling remote instructions mid-workflow.
    #   Task/Agent: a subagent would escape this skill's own restrictions
    #     and the Checkpoint confirmations.
    # Browser/MCP tools are deliberately NOT denied: they can't be
    # enumerated statically, and a deny-list doesn't need to name them.
    - WebFetch
    - WebSearch
    - Task
    - Agent

plugin: coreweave-cks-skills

includes:
  - name: create-api-token
    params:
      TOKEN_NAME: cks-cluster-token
      TOKEN_SCOPE: read-write
      SECRET_STORE_HINT: your password manager
  # Rendered between Step 6 and Step 7, not in "Before you start": the kubeconfig
  # cannot exist until Phase 1 has created the cluster.
  - name: generate-kubeconfig
    params:
      CLUSTER_NAME: <CLUSTER_NAME>
  # The canonical pinned fetch of coreweave/reference-architecture. The commit
  # SHA lives once, in the snippet; see _snippets/coreweave-cks.md.
  - name: fetch-pinned-ref-arch
    params:
      HEADING: "### Fetch the reference architecture (pinned)"
      PIN_RISK: |-
        an unreviewed upstream change would otherwise run under the customer's
        credentials on the very next `terraform apply`.
  # The size-scaled confirmation gate (APPSEC-3972). The thresholds live once,
  # in the snippet; see _snippets/cost-gates.md.
  - name: size-scaled-confirmation
    params:
      ACTION: apply
      UNIT: nodes
      PRIOR_CONSENT: 'an earlier "yes" at the tfvars stage'
      EXAMPLE_REPLY: 'yes, 8 nodes of gd-8xh100ib-i128'
