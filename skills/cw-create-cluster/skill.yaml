frontmatter:
  name: cw-create-cluster
  description: >-
    Programmatically creates a CKS (CoreWeave Kubernetes Service) cluster and VPC
    using the CoreWeave Terraform reference architecture. Covers quota checking,
    VPC creation, cluster provisioning, waiting for readiness, and the cluster's
    first node pool. Use this skill whenever a customer mentions creating a cluster,
    setting up CKS, provisioning Kubernetes infrastructure, deploying a new
    environment, or wants help with CoreWeave Terraform. Use when asked to create a
    cluster, create a CKS cluster, create a coreweave Kubernetes cluster. Also use it
    when someone asks about VPCs, Kubernetes versions, or cluster networking on
    CoreWeave. If the customer ALREADY has a running cluster and only wants to add
    compute, use cw-create-node-pool instead.
  allowed-tools:
    - Bash
    - Read
    - Write

# Opt out of allowed-tools propagation (APPSEC-3961): the quota-check step
# (references/quota-check.md) drives the CoreWeave Console via
# environment-provided browser tools whose names cannot be statically
# enumerated here. Enforcing the Bash/Read/Write list above would break that
# path, so this skill ships without an allowed-tools restriction. The list
# above stays in the manifest as a record of the non-browser tool needs.
allowed-tools-unrestricted: >-
  The browser quota-check flow (references/quota-check.md) needs
  environment-provided browser tools that can't be statically enumerated.

plugin: coreweave-cks-skills

includes:
  - name: create-api-token
    params:
      TOKEN_NAME: cks-cluster-token
      TOKEN_SCOPE: read-write
      SECRET_STORE_HINT: your password manager
  # Rendered between Step 6 and Step 7, not in "Before you start": the kubeconfig
  # cannot exist until Phase 1 has created the cluster.
  - name: generate-kubeconfig
    params:
      CLUSTER_NAME: <CLUSTER_NAME>
