# EXAMPLE SKILL MANIFEST — not production content.
#
# This file is the source of truth for one workflow skill. The build
# combines this manifest with `body.md` (the bespoke prose) and the
# snippet bodies it references to emit `dist/<name>/SKILL.md`.
#
# Humans edit `skill.yaml` and `body.md`. Humans NEVER hand-edit
# anything in dist/ — those files carry a "generated, do not edit"
# provenance header and CI fails the PR if they drift from a fresh
# build.
#
# Schema overview (a maintainer can change field names freely — the
# build script reads them from one place):
#
#   frontmatter:    YAML block emitted verbatim at the top of SKILL.md.
#                   This is what Claude / the Skill loader sees.
#   plugin:         Which marketplace plugin this skill ships in.
#                   Must match a directory under plugins/.
#   includes:       Ordered list of snippets to resolve at build time.
#                   Each entry maps a snippet `name` (the tag inside
#                   _snippets/*.md) to a dict of parameter values.
#                   Parameters are substituted into the snippet body
#                   before it is inlined into the rendered SKILL.md.
#
# Indentation convention: two spaces. YAML indentation must use spaces;
# do not use tabs here, as YAML parsers such as PyYAML reject tabs for
# indentation.

# ---------------------------------------------------------------------
# Frontmatter — emitted as-is at the top of dist/<name>/SKILL.md.
# Keep `description` "pushy" so the Skill router actually triggers it:
# lead with the verbs/nouns a customer would say, list concrete
# triggering phrases. See README "pushy description" glossary entry.
# ---------------------------------------------------------------------
frontmatter:
  name: example-skill-template
  description: >-
    EXAMPLE TEMPLATE — replace before shipping. Drives the customer
    through <workflow>. Triggers on phrases like "<phrase 1>",
    "<phrase 2>", "<phrase 3>". Not a real skill — do not list this
    in any plugin manifest.
  allowed-tools:
    # A record of the tools this workflow legitimately needs. NOT a
    # restriction and NOT emitted: in a SKILL.md the loader reads
    # `allowed-tools` as a permission PRE-APPROVAL (use without
    # prompting the customer), leaving every unlisted tool callable.
    # Use `disallowed-tools` below to actually narrow the skill.
    - Bash
    - Read
    - Write

# Which marketplace plugin owns this skill. The build copies the
# rendered SKILL.md into plugins/<plugin>/skills/<name>/SKILL.md.
plugin: coreweave-platform-skills

# Snippets to inline, in order of appearance in body.md.
# Each `name` must correspond to a `<!-- snippet:NAME -->` region in
# some file under _snippets/. The build resolves them globally — it
# does not care which file the region lives in.
#
# `params` is passed to Jinja2 when rendering the snippet body, so any
# `{{ FOO }}` placeholder inside the snippet picks up the value here.
# Missing required params are a build error, and so is a param the snippet
# never references: Jinja2 drops it silently, so guidance it was meant to
# render would never reach the customer (that is how TOKEN_SCOPE went
# unrendered in every skill — APPSEC-3961). Build-only metadata is exempt
# via SOURCE_ONLY_INCLUDE_PARAMS in build.py.
includes:
  - name: create-api-token
    params:
      TOKEN_NAME: example-workflow-token
      # Lint-only: not rendered (the Console has no scope selector), but a
      # `read-write` value requires a top-level `token-scope-justification`.
      TOKEN_SCOPE: read-only
      # Rendered. The minimal IAM roles this workflow needs — the only real
      # lever on a CoreWeave token's authority, since it inherits its
      # creating user's roles.
      TOKEN_ROLES: >-
        **CKS Viewer** (read-only: list and view clusters and VPC resources) and
        **Access Token Admin** (mint this token)
      # Rendered immediately after TOKEN_ROLES, as its own sentence(s). Empty
      # where the roles need no caveat. Keep TOKEN_ROLES a bare noun phrase and
      # put any prose here: the snippet closes the roles sentence with its own
      # period, so a value that trails off mid-clause cannot break the frame.
      TOKEN_ROLES_NOTE: ""
      # Rendered. Recommended expiration: the workflow's own duration.
      TOKEN_EXPIRY: 8 hours
      SECRET_STORE_HINT: your password manager
  - name: generate-kubeconfig
    params:
      CLUSTER_NAME: example-cluster
  - name: verify-workload-health
    params:
      CLUSTER_NAME: example-cluster
      POD_SELECTOR: -n default -l app=example
