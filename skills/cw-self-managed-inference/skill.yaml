frontmatter:
  name: cw-self-managed-inference
  description: >-
    Deploy a self-managed vLLM inference service on a CoreWeave CKS cluster with
    TLS ingress and a public IP. Use this skill whenever a customer mentions
    deploying an inference model, serving an LLM, running vLLM, setting up model
    serving, or wants to deploy AI inference on CoreWeave — even if they don't
    say "self-managed inference" explicitly. Also use when someone asks about
    inference frameworks on CoreWeave, how to expose a model endpoint, or wants
    to test a model deployment on CKS.
  allowed-tools:
    - Bash
    - Read
    - Write

plugin: coreweave-cks-skills

includes:
  - name: create-api-token
    params:
      TOKEN_NAME: inference-token
      TOKEN_SCOPE: read-write
      SECRET_STORE_HINT: your password manager
  - name: generate-kubeconfig
    params:
      CLUSTER_NAME: <your-cluster-name>
  - name: verify-workload-health
    params:
      CLUSTER_NAME: <your-cluster-name>
      POD_SELECTOR: -n inference -l app=inference
  # The canonical pinned fetch of coreweave/reference-architecture. The commit
  # SHA lives once, in the snippet; see _snippets/coreweave-cks.md.
  - name: fetch-pinned-ref-arch
    params:
      HEADING: >-
        ## Step 2 — Fetch the reference architecture (pinned) and copy the Helm chart
      PIN_RISK: |-
        an unreviewed upstream change would otherwise deploy unreviewed chart
        changes to the customer's cluster.
  # The size-scaled confirmation gate (APPSEC-3972). The thresholds live once,
  # in the snippet; see _snippets/cost-gates.md.
  - name: size-scaled-confirmation
    params:
      ACTION: deploy
      UNIT: replicas
      PRIOR_CONSENT: 'an earlier "yes" from Step 3 or the model choice'
      EXAMPLE_REPLY: 'yes, 16 GPUs'
