frontmatter:
  name: cw-self-managed-inference
  description: >-
    Deploy a self-managed vLLM inference service on a CoreWeave CKS cluster with
    TLS ingress and a public IP. Use this skill whenever a customer mentions
    deploying an inference model, serving an LLM, running vLLM, setting up model
    serving, or wants to deploy AI inference on CoreWeave — even if they don't
    say "self-managed inference" explicitly. Also use when someone asks about
    inference frameworks on CoreWeave, how to expose a model endpoint, or wants
    to test a model deployment on CKS.
  allowed-tools:
    - Bash
    - Read
    - Write
  disallowed-tools:
    # Removed from the model's pool while this skill is active (the Skill
    # loader enforces this key; `allowed-tools` above does not restrict).
    # Conservative starting set — none of these appear in any skill body:
    #   WebFetch/WebSearch: block pulling remote instructions mid-workflow.
    #   Task/Agent: a subagent would escape this skill's own restrictions
    #     and the Checkpoint confirmations.
    # Browser/MCP tools are deliberately NOT denied: they can't be
    # enumerated statically, and a deny-list doesn't need to name them.
    - WebFetch
    - WebSearch
    - Task
    - Agent

plugin: coreweave-cks-skills

# Why this workflow's token needs write authority (APPSEC-3961). Required
# by build.py whenever TOKEN_SCOPE is `read-write`; never emitted.
token-scope-justification: >-
  Deploying the vLLM release creates a namespace, a secret, and Helm resources
  in-cluster. Managed Auth maps CKS Admin to in-cluster `edit`; CKS Viewer
  maps to `view`, which cannot create them, so read-only is not an option. No
  narrower per-action token type exists (APPSEC-3961). Narrowed by minimal-
  role guidance, a least-privilege minting user, an 8-hour expiry default, and
  post-run deletion.

includes:
  - name: create-api-token
    params:
      TOKEN_NAME: inference-token
      # Lint-only: not rendered (the Console has no scope selector), but a
      # `read-write` value requires a top-level `token-scope-justification`.
      TOKEN_SCOPE: read-write
      # Rendered. The minimal IAM roles this workflow needs — the only real
      # lever on a CoreWeave token's authority, since it inherits its
      # creating user's roles.
      TOKEN_ROLES: >-
        **CKS Admin** and **Access Token Admin** (mint this token). Managed Auth
        maps CKS Admin to in-cluster `edit`, which creating the namespace, secret,
        and Helm release requires; CKS Viewer maps to read-only `view` and cannot
      # Rendered. Must be an option the Console dialog actually offers:
      # 1 hour / 8 hours / One month / 90 days / One year / Never.
      TOKEN_EXPIRY: 8 hours
      SECRET_STORE_HINT: your password manager
  - name: generate-kubeconfig
    params:
      CLUSTER_NAME: <your-cluster-name>
  - name: verify-workload-health
    params:
      CLUSTER_NAME: <your-cluster-name>
      POD_SELECTOR: -n inference -l app=inference
  # The canonical pinned fetch of coreweave/reference-architecture. The commit
  # SHA lives once, in the snippet; see _snippets/coreweave-cks.md.
  - name: fetch-pinned-ref-arch
    params:
      HEADING: >-
        ## Step 2 — Fetch the reference architecture (pinned) and copy the Helm chart
      PIN_RISK: |-
        an unreviewed upstream change would otherwise deploy unreviewed chart
        changes to the customer's cluster.
  # The size-scaled confirmation gate (APPSEC-3972). The thresholds live once,
  # in the snippet; see _snippets/cost-gates.md.
  - name: size-scaled-confirmation
    params:
      ACTION: deploy
      UNIT: replicas
      PRIOR_CONSENT: 'an earlier "yes" from Step 3 or the model choice'
      EXAMPLE_REPLY: 'yes, 16 GPUs'
