# Manifest for the cw-load-model-to-bucket workflow skill.
# Humans edit this file and body.md; never hand-edit anything in dist/.
# Run `python build.py` to render dist/<name>/SKILL.md and the plugin mirror.

frontmatter:
  name: cw-load-model-to-bucket
  description: >-
    Provision a CoreWeave AI Object Storage (CAIOS) bucket and load a Hugging
    Face model into it: create the bucket, download the model weights, and
    upload them so they are ready for Bring-Your-Own-Weights (BYOW) inference.
    Defaults to google/gemma-3-270m-it, a small instruction-tuned model.
    Hugging Face requires the customer to accept the Gemma terms and
    authenticate before downloading it. Use this skill whenever a customer
    wants to
    "create an object storage bucket", "provision a CAIOS bucket", "make an S3
    bucket on CoreWeave", "put a model in a bucket", "upload model weights to
    object storage", "get a Hugging Face model into CoreWeave storage", "stage
    model weights", "download Gemma 3 into a bucket", or "set up a bucket
    with model weights for BYOW inference". Also use it when someone asks how
    to get model artifacts into a CoreWeave bucket before creating a CoreWeave
    Inference deployment, which cannot pull from Hugging Face directly. This
    skill provisions object storage and stages weights only; it does NOT
    deploy a serving endpoint. For self-managed vLLM serving that downloads
    from Hugging Face at runtime, use cw-self-managed-inference instead.
  allowed-tools:
    - Bash
    - Read
    - Write
  disallowed-tools:
    # Removed from the model's pool while this skill is active (the Skill
    # loader enforces this key; `allowed-tools` above does not restrict).
    # Conservative starting set — none of these appear in any skill body:
    #   WebFetch/WebSearch: block pulling remote instructions mid-workflow.
    #   Task/Agent: a subagent would escape this skill's own restrictions
    #     and the Checkpoint confirmations.
    # Browser/MCP tools are deliberately NOT denied: they can't be
    # enumerated statically, and a deny-list doesn't need to name them.
    - WebFetch
    - WebSearch
    - Task
    - Agent

# First skill in the storage plugin.
plugin: coreweave-storage-skills

# Reuse the canonical token-creation procedure; the CoreWeave API access
# token is what we exchange for an Object Storage access key in Step 2.
# Why this workflow's token needs write authority (APPSEC-3961). Required
# by build.py whenever TOKEN_SCOPE is `read-write`; never emitted.
token-scope-justification: >-
  Creating the bucket and uploading weights is write authority by definition,
  and exchanging the token for object-storage credentials needs
  `cwobject:CreateAccessKey`. Unlike the CKS workflows this one has a
  genuinely narrower option that does not depend on the missing Console
  control: an organization access policy granting only the four actions listed
  in TOKEN_ROLES, instead of blanket Object Storage Admin. The token step
  offers that alternative, plus an 8-hour expiry default and post-run
  deletion.

includes:
  - name: create-api-token
    params:
      TOKEN_NAME: object-storage-token
      # Lint-only: not rendered (the Console has no scope selector), but a
      # `read-write` value requires a top-level `token-scope-justification`.
      TOKEN_SCOPE: read-write
      # Rendered. The minimal IAM roles this workflow needs — the only real
      # lever on a CoreWeave token's authority, since it inherits its
      # creating user's roles.
      TOKEN_ROLES: >-
        **Object Storage Admin** (create the bucket and mint an access key) and
        **Access Token Admin** (mint this token). Narrower alternative: an
        organization access policy granting only `cwobject:CreateAccessKey`,
        `cwobject:ListBucketInfo`, `s3:CreateBucket`, and `s3:PutObject`
      # Rendered. Must be an option the Console dialog actually offers:
      # 1 hour / 8 hours / One month / 90 days / One year / Never.
      TOKEN_EXPIRY: 8 hours
      SECRET_STORE_HINT: your password manager
