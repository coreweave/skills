# Manifest for the cw-load-model-to-bucket workflow skill.
# Humans edit this file and body.md; never hand-edit anything in dist/.
# Run `python build.py` to render dist/<name>/SKILL.md and the plugin mirror.

frontmatter:
  name: cw-load-model-to-bucket
  description: >-
    Provision a CoreWeave AI Object Storage (CAIOS) bucket and load a Hugging
    Face model into it: create the bucket, download the model weights, and
    upload them so they are ready for Bring-Your-Own-Weights (BYOW) inference.
    Defaults to google/gemma-3-270m-it, a small instruction-tuned model.
    Hugging Face requires the customer to accept the Gemma terms and
    authenticate before downloading it. Use this skill whenever a customer
    wants to
    "create an object storage bucket", "provision a CAIOS bucket", "make an S3
    bucket on CoreWeave", "put a model in a bucket", "upload model weights to
    object storage", "get a Hugging Face model into CoreWeave storage", "stage
    model weights", "download Gemma 3 into a bucket", or "set up a bucket
    with model weights for BYOW inference". Also use it when someone asks how
    to get model artifacts into a CoreWeave bucket before creating a CoreWeave
    Inference deployment, which cannot pull from Hugging Face directly. This
    skill provisions object storage and stages weights only; it does NOT
    deploy a serving endpoint. For self-managed vLLM serving that downloads
    from Hugging Face at runtime, use cw-self-managed-inference instead.
  allowed-tools:
    - Bash
    - Read
    - Write

# First skill in the storage plugin.
plugin: coreweave-storage-skills

# Reuse the canonical token-creation procedure; the CoreWeave API access
# token is what we exchange for an Object Storage access key in Step 2.
includes:
  - name: create-api-token
    params:
      TOKEN_NAME: object-storage-token
      TOKEN_SCOPE: read-write
      SECRET_STORE_HINT: your password manager
